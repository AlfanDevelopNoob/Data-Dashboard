<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <nav class="navbar-title">
      <i class="fa-solid fa-graduation-cap"></i> <h3>Student Dashboard</h3>
    </nav>
  </header>
  <main class="container">
    <section class="card card-cari">
      <label class="label-cari" for="inputCari">Cari Siswa</label>
      <div class="kotak-cari">
        <i class="fa-solid fa-magnifying-glass ikon-cari"></i>
        <input type="text" id="inputCari" placeholder="Cari nama siswa..." autocomplete="off">
      </div>
    </section>
    <section class="card">
      <p class="info-jumlah" id="infoJumlah"></p>
      <div class="bungkus-tabel">
        <table>
          <thead>
            <tr>
              <th class="kolom-no">No</th>
              <th class="kolom-nama">Nama Siswa</th>
              <th class="kolom-tengah">Kelas</th>
              <th class="kolom-tengah">Status</th>
              <th class="kolom-tengah">Nilai (Score)</th>
            </tr>
          </thead>
          <tbody id="isiTabelSiswa">
            
          </tbody>
        </table>
      </div>
      <div class="card-footer">
        <p class="label-rata-rata">Rata-rata Nilai Kelas:</p>
        <p class="nilai-rata-rata" id="nilaiRataRata">0</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
